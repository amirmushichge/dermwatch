appId: com.dermwatch.local
productName: DermWatch
artifactName: DermWatch-Setup-${version}.${ext}
directories:
  output: release
  buildResources: build-resources
files:
  - desktop/**
  - dist/**
  - server.mjs
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build-resources/icon.png
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: amirmushichge
  repo: dermwatch
