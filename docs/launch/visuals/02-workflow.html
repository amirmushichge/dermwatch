<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="shared.css" />
    <title>DermWatch single-photo check</title>
    <style>
      .content { margin-top: 52px; display: grid; grid-template-columns: 0.72fr 1.28fr; gap: 48px; align-items: center; }
      .copy { padding-left: 12px; }
      .copy h1 { margin-top: 28px; max-width: 560px; font-size: 74px; line-height: 0.94; letter-spacing: -0.06em; }
      .copy p { margin-top: 28px; max-width: 520px; color: var(--muted); font-size: 20px; line-height: 1.34; letter-spacing: -0.035em; }
      .proof { height: 610px; padding: 26px; display: flex; align-items: center; background: var(--surface); }
      .proof img { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 18px; }
      .tags { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 10px; }
    </style>
  </head>
  <body>
    <main class="frame">
      <header class="topbar"><span>DERMWATCH</span><span class="meta">02 / ONE PHOTO</span></header>
      <section class="content">
        <div class="copy">
          <div class="eyebrow">PHOTO-ONLY MEASUREMENTS</div>
          <h1>Useful before the second photo</h1>
          <p>DermWatch checks capture quality first. If the image is unreliable, it asks for a retake instead of inventing a confident result.</p>
          <div class="tags"><span class="tag">Quality gate</span><span class="tag">ABCDE measures</span></div>
        </div>
        <div class="card proof"><img src="assets/single-photo-result.png" alt="DermWatch single-photo quality result" /></div>
      </section>
      <footer class="footer"><span>PULSE × @AMIRMUSHICH</span><span>[LOCAL] [NOT A DIAGNOSIS]</span></footer>
    </main>
  </body>
</html>
